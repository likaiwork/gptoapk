name: 🚀 Deploy to RackNerd VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 🚀 Deploy on VPS (git pull + build + pm2)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 35m
          script: |
            set -euo pipefail
            cd /var/www/gptoapk
            # Pull first so this run uses the latest deploy.sh from the same commit.
            git fetch origin main
            git reset --hard origin/main
            bash scripts/vps/deploy.sh

      - name: ✅ Smoke check public site
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -L "https://www.gptoapk.com/" || echo "000")
            echo "attempt $i -> $code"
            if [[ "$code" == "200" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Public smoke check failed"
          exit 1

      - name: 📥 Checkout (for SEO submit scripts)
        uses: actions/checkout@v4

      - name: 📥 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🔎 Submit URLs to Baidu
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BAIDU_SITE: ${{ vars.BAIDU_SITE || 'https://gptoapk.com' }}
          BAIDU_SITE_PARAM: ${{ vars.BAIDU_SITE_PARAM || 'gptoapk.com' }}
          BAIDU_SITEMAPS: ${{ vars.BAIDU_SITEMAPS || 'https://gptoapk.com/sitemap-zh.xml,https://gptoapk.com/sitemap-ai.xml' }}
        run: |
          if [ -z "${BAIDU_TOKEN:-}" ]; then
            echo "::warning::BAIDU_TOKEN not set; skipping baidu-submit."
            exit 0
          fi
          npm run baidu-submit

      - name: 📡 IndexNow — India APK cluster
        env:
          INDEXNOW_HOST: https://www.gptoapk.com
          INDEXNOW_SITEMAP_HOST: https://www.gptoapk.com
        run: npm run indexnow:india || echo "::warning::IndexNow india cluster submit failed (non-blocking)"
